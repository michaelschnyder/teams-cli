name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require matching package version and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Release tag must equal v'+p.version)"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check and test
        run: npm run check && npm test
      - name: Build and validate package
        run: npm run build && npm run package:check && npm run package:smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Configure one-time bootstrap credential
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_BOOTSTRAP_TOKEN" --location=user
          fi
      - name: Publish public package
        run: npm publish --ignore-scripts --access public
