name: Publish to npm

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      notes:
        description: Optional notes for a snapshot without an open pull request
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    uses: ./.github/workflows/verify-package.yml
    with:
      source_ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Select publication mode
        id: publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            release) echo "mode=stable" >> "$GITHUB_OUTPUT" ;;
            pull_request) echo "mode=canary" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "mode=snapshot" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Checkout publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Setup latest LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare version and build provenance
        id: prepared
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_NOTES: ${{ inputs.notes }}
        run: node scripts/prepare-publication.mjs "${{ steps.publication.outputs.mode }}"
      - name: Build and validate package
        run: npm run build && npm run package:check && npm run package:smoke
      - name: Publish public package
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PUBLISH_TAG: ${{ steps.prepared.outputs.tag }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_BOOTSTRAP_TOKEN" --location=user
          fi
          npm publish --ignore-scripts --access public --tag "$PUBLISH_TAG"
      - name: Publish installation summary
        env:
          MODE: ${{ steps.prepared.outputs.mode }}
          VERSION: ${{ steps.prepared.outputs.version }}
          INSTALL: ${{ steps.prepared.outputs.install }}
        run: |
          {
            echo "## Published $MODE build"
            echo
            echo "Version: \`$VERSION\`"
            echo
            echo "Install with:"
            echo
            echo '```console'
            echo "$INSTALL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
