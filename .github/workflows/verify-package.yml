name: Verify package

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or tag to check out and verify
        required: true
        type: string
      operating_systems:
        description: JSON array of GitHub-hosted runners to use
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node LTS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating_systems) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Setup latest LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
      - name: Validate package contents
        run: npm run package:check
      - name: Smoke-test installed package
        run: npm run package:smoke
