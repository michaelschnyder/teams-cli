name: Verify package

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or tag to check out and verify
        required: true
        type: string
      operating_systems:
        description: JSON array of GitHub-hosted runners to use
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      audit:
        description: Run the production dependency audit on Ubuntu
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node LTS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating_systems) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Setup latest LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        if: inputs.audit && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            set -e
            echo "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eiq '429|5[0-9]{2}|ECONNRESET|ETIMEDOUT|audit endpoint returned an error' <<< "$output"; then
              exit "$status"
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep "$((attempt * 5))"
          done
      - name: Validate package contents
        run: npm run package:check
      - name: Smoke-test installed package
        run: npm run package:smoke
